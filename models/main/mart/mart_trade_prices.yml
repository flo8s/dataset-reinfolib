version: 2

models:
  - name: mart_trade_prices
    description: 国土交通省 不動産情報ライブラリに基づく、全国の不動産取引価格・成約価格情報。物件種別、所在地（都道府県・市区町村・地区）、取引価格、面積、単価、建築年、構造、用途、取引時期などを収録する。
    columns:
      - name: property_type
      - name: region
      - name: municipality_code
      - name: prefecture
      - name: municipality
      - name: district_name
      - name: trade_price
      - name: price_per_unit
      - name: floor_plan
      - name: area
      - name: unit_price
      - name: land_shape
      - name: frontage
      - name: total_floor_area
      - name: building_year
      - name: structure
      - name: use_type
      - name: purpose
      - name: direction
      - name: classification
      - name: breadth
      - name: city_planning
      - name: coverage_ratio
      - name: floor_area_ratio
      - name: period
      - name: renovation
      - name: remarks
      - name: price_category
      - name: district_code
      - name: prefecture_code
      - name: year
      - name: quarter
